<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Music Link Sharer — share any song, on every platform</title>
    <meta
      name="description"
      content="Search a song, pick the right version, and share one message with links for Spotify, Apple Music, YouTube Music and more."
    />
    <meta name="theme-color" content="#faf8f5" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('relay-theme');
          document.documentElement.dataset.theme = saved === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
